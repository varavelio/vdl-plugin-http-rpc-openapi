openapi: 3.0.0
info:
  title: Auth Basic API
  version: 1.0.0
security:
  - Auth: []
tags:
  - name: EntityServiceProcedures
    description: Procedures for EntityService
paths:
  /entityService/getEntity:
    post:
      tags:
        - EntityServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/EntityServiceGetEntityInput"
      responses:
        "200":
          $ref: "#/components/responses/EntityServiceGetEntityOutput"
components:
  securitySchemes:
    Auth:
      type: http
      scheme: basic
      description: "Enter the username and password. Sent as `Authorization: Basic
        <base64(username:password)>` header."
  schemas:
    Entity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
  requestBodies:
    EntityServiceGetEntityInput:
      description: Request body for EntityService/getEntity procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
            required:
              - id
  responses:
    EntityServiceGetEntityOutput:
      description: Response for EntityService/getEntity procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  entity:
                    $ref: "#/components/schemas/Entity"
                required:
                  - entity
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
