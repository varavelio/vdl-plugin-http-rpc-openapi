openapi: 3.0.0
info:
  title: Auth None API
  version: 1.0.0
tags:
  - name: EntityServiceProcedures
    description: Procedures for EntityService
paths:
  /entityService/getEntity:
    post:
      operationId: entityServiceGetEntity
      tags:
        - EntityServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/EntityServiceGetEntityInput"
      responses:
        "200":
          $ref: "#/components/responses/EntityServiceGetEntityOutput"
        "404":
          $ref: "#/components/responses/RouteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/TransportFailure"
components:
  schemas:
    Entity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
  requestBodies:
    EntityServiceGetEntityInput:
      description: Request body for EntityService/getEntity procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
            required:
              - id
  responses:
    EntityServiceGetEntityOutput:
      description: Response for EntityService/getEntity procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  entity:
                    $ref: "#/components/schemas/Entity"
                required:
                  - entity
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    InternalError:
      description: Unhandled server failure. Transport failure, never an application
        error envelope.
    RouteNotFound:
      description: Unknown route. The procedure path does not exist. Transport
        failure, never an application error envelope.
    TransportFailure:
      description: Transport or infrastructure failure. Transport failure, never an
        application error envelope.
