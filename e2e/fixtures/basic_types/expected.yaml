openapi: 3.0.0
info:
  title: Basic Types API
  version: 1.0.0
security:
  - Auth: []
tags:
  - name: ServiceProcedures
    description: Procedures for Service
paths:
  /service/createUser:
    post:
      operationId: serviceCreateUser
      tags:
        - ServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ServiceCreateUserInput"
      responses:
        "200":
          $ref: "#/components/responses/ServiceCreateUserOutput"
        "404":
          $ref: "#/components/responses/RouteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/TransportFailure"
  /service/getUser:
    post:
      operationId: serviceGetUser
      tags:
        - ServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ServiceGetUserInput"
      responses:
        "200":
          $ref: "#/components/responses/ServiceGetUserOutput"
        "404":
          $ref: "#/components/responses/RouteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/TransportFailure"
components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Authorization
      description: "Enter the API key value. Sent as `Authorization: {apiKey}` header."
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        age:
          type: integer
        score:
          type: number
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - age
        - score
        - isActive
        - createdAt
  requestBodies:
    ServiceCreateUserInput:
      description: Request body for Service/createUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              age:
                type: integer
              score:
                type: number
              isActive:
                type: boolean
            required:
              - name
              - age
              - score
              - isActive
    ServiceGetUserInput:
      description: Request body for Service/getUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
            required:
              - id
  responses:
    InternalError:
      description: Unhandled server failure. Transport failure, never an application
        error envelope.
    RouteNotFound:
      description: Unknown route. The procedure path does not exist. Transport
        failure, never an application error envelope.
    ServiceCreateUserOutput:
      description: Response for Service/createUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  id:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - createdAt
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    ServiceGetUserOutput:
      description: Response for Service/getUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                required:
                  - user
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    TransportFailure:
      description: Transport or infrastructure failure. Transport failure, never an
        application error envelope.
