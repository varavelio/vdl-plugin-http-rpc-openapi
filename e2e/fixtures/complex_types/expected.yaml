openapi: 3.0.0
info:
  title: Complex Types API
  version: 1.0.0
security:
  - Auth: []
tags:
  - name: DataServiceProcedures
    description: Procedures for DataService
paths:
  /dataService/inlineTest:
    post:
      tags:
        - DataServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/DataServiceInlineTestInput"
      responses:
        "200":
          $ref: "#/components/responses/DataServiceInlineTestOutput"
  /dataService/processContainer:
    post:
      tags:
        - DataServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/DataServiceProcessContainerInput"
      responses:
        "200":
          $ref: "#/components/responses/DataServiceProcessContainerOutput"
components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Authorization
      description: "Enter the API key value. Sent as `Authorization: {apiKey}` header."
  schemas:
    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        country:
          type: string
      required:
        - street
        - city
        - country
    Contact:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        address:
          $ref: "#/components/schemas/Address"
      required:
        - email
        - phone
        - address
    Container:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        matrix:
          type: array
          items:
            type: array
            items:
              type: integer
        lookup:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/User"
        counts:
          type: object
          additionalProperties:
            type: array
            items:
              type: integer
      required:
        - users
        - matrix
        - lookup
        - counts
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        contact:
          $ref: "#/components/schemas/Contact"
      required:
        - id
        - name
        - tags
        - metadata
        - contact
  requestBodies:
    DataServiceInlineTestInput:
      description: Request body for DataService/inlineTest procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              simple:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    type: integer
                required:
                  - name
                  - value
              nested:
                type: object
                properties:
                  outer:
                    type: string
                  inner:
                    type: object
                    properties:
                      deep:
                        type: string
                    required:
                      - deep
                required:
                  - outer
                  - inner
              arrayOfInline:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    label:
                      type: string
                  required:
                    - id
                    - label
              mapOfInline:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    key:
                      type: string
                    active:
                      type: boolean
                  required:
                    - key
                    - active
            required:
              - simple
              - nested
              - arrayOfInline
              - mapOfInline
    DataServiceProcessContainerInput:
      description: Request body for DataService/processContainer procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/Container"
            required:
              - data
  responses:
    DataServiceInlineTestOutput:
      description: Response for DataService/inlineTest procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    DataServiceProcessContainerOutput:
      description: Response for DataService/processContainer procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  processed:
                    $ref: "#/components/schemas/Container"
                required:
                  - processed
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
