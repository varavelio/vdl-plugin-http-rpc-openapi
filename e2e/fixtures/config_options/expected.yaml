openapi: 3.0.0
info:
  title: My Custom API
  version: 2.5.0
  description: This is a custom API with full configuration.
  contact:
    name: API Team
    email: api@example.com
  license:
    name: MIT
security:
  - Auth: []
servers:
  - url: https://api.example.com/v2
tags:
  - name: ItemServiceProcedures
    description: Procedures for ItemService
paths:
  /itemService/getItem:
    post:
      tags:
        - ItemServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ItemServiceGetItemInput"
      responses:
        "200":
          $ref: "#/components/responses/ItemServiceGetItemOutput"
components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Authorization
      description: "Enter the API key value. Sent as `Authorization: {apiKey}` header."
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
  requestBodies:
    ItemServiceGetItemInput:
      description: Request body for ItemService/getItem procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
            required:
              - id
  responses:
    ItemServiceGetItemOutput:
      description: Response for ItemService/getItem procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/Item"
                required:
                  - item
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
