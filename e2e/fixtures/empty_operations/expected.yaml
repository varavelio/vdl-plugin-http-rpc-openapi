openapi: 3.0.0
info:
  title: Empty Operations API
  version: 1.0.0
security:
  - Auth: []
tags:
  - name: PingServiceProcedures
    description: Procedures for PingService
paths:
  /pingService/getStatus:
    post:
      operationId: pingServiceGetStatus
      tags:
        - PingServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/PingServiceGetStatusInput"
      responses:
        "200":
          $ref: "#/components/responses/PingServiceGetStatusOutput"
        "404":
          $ref: "#/components/responses/RouteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/TransportFailure"
  /pingService/logEvent:
    post:
      operationId: pingServiceLogEvent
      tags:
        - PingServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/PingServiceLogEventInput"
      responses:
        "200":
          $ref: "#/components/responses/PingServiceLogEventOutput"
        "404":
          $ref: "#/components/responses/RouteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/TransportFailure"
  /pingService/ping:
    post:
      operationId: pingServicePing
      tags:
        - PingServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/PingServicePingInput"
      responses:
        "200":
          $ref: "#/components/responses/PingServicePingOutput"
        "404":
          $ref: "#/components/responses/RouteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/TransportFailure"
components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Authorization
      description: "Enter the API key value. Sent as `Authorization: {apiKey}` header."
  requestBodies:
    PingServiceGetStatusInput:
      description: Request body for PingService/getStatus procedure
      content:
        application/json:
          schema:
            type: object
            properties: {}
    PingServiceLogEventInput:
      description: Request body for PingService/logEvent procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              event:
                type: string
              level:
                type: integer
            required:
              - event
              - level
    PingServicePingInput:
      description: Request body for PingService/ping procedure
      content:
        application/json:
          schema:
            type: object
            properties: {}
  responses:
    InternalError:
      description: Unhandled server failure. Transport failure, never an application
        error envelope.
    PingServiceGetStatusOutput:
      description: Response for PingService/getStatus procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: integer
                required:
                  - status
                  - uptime
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    PingServiceLogEventOutput:
      description: Response for PingService/logEvent procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties: {}
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    PingServicePingOutput:
      description: Response for PingService/ping procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties: {}
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    RouteNotFound:
      description: Unknown route. The procedure path does not exist. Transport
        failure, never an application error envelope.
    TransportFailure:
      description: Transport or infrastructure failure. Transport failure, never an
        application error envelope.
