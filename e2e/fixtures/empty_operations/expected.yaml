            type: object
            properties: {}
  responses:
    PingServiceGetStatusOutput:
      description: Response for PingService/getStatus procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: integer
                required:
                  - status
                  - uptime
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
