openapi: 3.0.0
info:
  title: Enums API
  version: 1.0.0
security:
  - Auth: []
tags:
  - name: TaskServiceProcedures
    description: Procedures for TaskService
paths:
  /taskService/createTask:
    post:
      operationId: taskServiceCreateTask
      tags:
        - TaskServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/TaskServiceCreateTaskInput"
      responses:
        "200":
          $ref: "#/components/responses/TaskServiceCreateTaskOutput"
  /taskService/getTasksByPriority:
    post:
      operationId: taskServiceGetTasksByPriority
      tags:
        - TaskServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/TaskServiceGetTasksByPriorityInput"
      responses:
        "200":
          $ref: "#/components/responses/TaskServiceGetTasksByPriorityOutput"
components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Authorization
      description: "Enter the API key value. Sent as `Authorization: {apiKey}` header."
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        priority:
          $ref: "#/components/schemas/Priority"
        assigneeRole:
          $ref: "#/components/schemas/Role"
      required:
        - id
        - title
        - priority
        - assigneeRole
    Priority:
      type: integer
      enum:
        - 1
        - 5
        - 10
        - 100
      description: Priority levels for tasks.
    Role:
      type: string
      enum:
        - Admin
        - User
        - Guest
      description: User role in the system.
  requestBodies:
    TaskServiceCreateTaskInput:
      description: Request body for TaskService/createTask procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              priority:
                $ref: "#/components/schemas/Priority"
              assigneeRole:
                $ref: "#/components/schemas/Role"
            required:
              - title
              - priority
              - assigneeRole
    TaskServiceGetTasksByPriorityInput:
      description: Request body for TaskService/getTasksByPriority procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              priority:
                $ref: "#/components/schemas/Priority"
            required:
              - priority
  responses:
    TaskServiceCreateTaskOutput:
      description: Response for TaskService/createTask procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
                required:
                  - task
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    TaskServiceGetTasksByPriorityOutput:
      description: Response for TaskService/getTasksByPriority procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                required:
                  - tasks
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
