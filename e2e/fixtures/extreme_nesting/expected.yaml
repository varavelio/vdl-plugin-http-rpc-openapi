openapi: 3.0.0
info:
  title: Extreme Nesting API
  version: 1.0.0
security:
  - Auth: []
tags:
  - name: ExtremeServiceProcedures
    description: Procedures for ExtremeService
paths:
  /extremeService/collectionTest:
    post:
      tags:
        - ExtremeServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ExtremeServiceCollectionTestInput"
      responses:
        "200":
          $ref: "#/components/responses/ExtremeServiceCollectionTestOutput"
  /extremeService/deepMetadataTest:
    post:
      tags:
        - ExtremeServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ExtremeServiceDeepMetadataTestInput"
      responses:
        "200":
          $ref: "#/components/responses/ExtremeServiceDeepMetadataTestOutput"
  /extremeService/handleMatrices:
    post:
      tags:
        - ExtremeServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ExtremeServiceHandleMatricesInput"
      responses:
        "200":
          $ref: "#/components/responses/ExtremeServiceHandleMatricesOutput"
  /extremeService/inlineExtreme:
    post:
      tags:
        - ExtremeServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ExtremeServiceInlineExtremeInput"
      responses:
        "200":
          $ref: "#/components/responses/ExtremeServiceInlineExtremeOutput"
  /extremeService/optionalLabyrinth:
    post:
      tags:
        - ExtremeServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ExtremeServiceOptionalLabyrinthInput"
      responses:
        "200":
          $ref: "#/components/responses/ExtremeServiceOptionalLabyrinthOutput"
  /extremeService/processDeep:
    post:
      tags:
        - ExtremeServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ExtremeServiceProcessDeepInput"
      responses:
        "200":
          $ref: "#/components/responses/ExtremeServiceProcessDeepOutput"
  /extremeService/queryMaps:
    post:
      tags:
        - ExtremeServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ExtremeServiceQueryMapsInput"
      responses:
        "200":
          $ref: "#/components/responses/ExtremeServiceQueryMapsOutput"
  /extremeService/stressTest:
    post:
      tags:
        - ExtremeServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ExtremeServiceStressTestInput"
      responses:
        "200":
          $ref: "#/components/responses/ExtremeServiceStressTestOutput"
components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Authorization
      description: "Enter the API key value. Sent as `Authorization: {apiKey}` header."
  schemas:
    BaseA:
      type: object
      properties:
        fieldA:
          type: string
        valueA:
          type: integer
      required:
        - fieldA
        - valueA
    BaseB:
      type: object
      properties:
        fieldB:
          type: number
        flagB:
          type: boolean
      required:
        - fieldB
        - flagB
    BaseC:
      type: object
      properties:
        fieldC:
          type: string
          format: date-time
        listC:
          type: array
          items:
            type: string
      required:
        - fieldC
        - listC
    CollectionHell:
      type: object
      properties:
        level1:
          type: array
          items:
            type: object
            additionalProperties:
              type: array
              items:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          additionalProperties:
                            type: array
                            items:
                              type: object
                              properties:
                                values:
                                  type: array
                                  items:
                                    type: array
                                    items:
                                      type: integer
                              required:
                                - values
                    required:
                      - items
        complex:
          type: object
          properties:
            arrays:
              type: array
              items:
                type: array
                items:
                  type: array
                  items:
                    type: integer
            maps:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
            mixed:
              type: array
              items:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    arr:
                      type: array
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            m:
                              type: object
                              additionalProperties:
                                type: array
                                items:
                                  type: integer
                          required:
                            - m
                  required:
                    - arr
          required:
            - arrays
            - maps
            - mixed
      required:
        - level1
        - complex
    DeepMetadata:
      type: object
      properties:
        id:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          properties:
            fieldA:
              type: string
            valueA:
              type: integer
            nested:
              type: object
              properties:
                fieldB:
                  type: number
                flagB:
                  type: boolean
                deepData:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: object
                      properties:
                        fieldC:
                          type: string
                          format: date-time
                        listC:
                          type: array
                          items:
                            type: string
                        value:
                          type: integer
                      required:
                        - fieldC
                        - listC
                        - value
              required:
                - fieldB
                - flagB
                - deepData
          required:
            - fieldA
            - valueA
            - nested
      required:
        - id
        - tags
    DeepNesting:
      type: object
      properties:
        level1:
          type: object
          properties:
            a:
              type: string
            level2:
              type: object
              properties:
                b:
                  type: integer
                level3:
                  type: object
                  properties:
                    c:
                      type: number
                    level4:
                      type: object
                      properties:
                        d:
                          type: boolean
                        level5:
                          type: object
                          properties:
                            e:
                              type: string
                              format: date-time
                            level6:
                              type: object
                              properties:
                                f:
                                  type: string
                                level7:
                                  type: object
                                  properties:
                                    g:
                                      type: integer
                                    level8:
                                      type: object
                                      properties:
                                        h:
                                          type: number
                                        finalValue:
                                          type: string
                                      required:
                                        - h
                                        - finalValue
                                  required:
                                    - g
                                    - level8
                              required:
                                - f
                                - level7
                          required:
                            - e
                            - level6
                      required:
                        - d
                        - level5
                  required:
                    - c
                    - level4
              required:
                - b
                - level3
          required:
            - a
            - level2
      required:
        - level1
    MapCeption:
      type: object
      properties:
        level1:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        level2:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              properties:
                value:
                  type: integer
                label:
                  type: string
              required:
                - value
                - label
        mixed1:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: integer
        mixed2:
          type: array
          items:
            type: object
            additionalProperties:
              type: array
              items:
                type: integer
      required:
        - level1
        - level2
        - mixed1
        - mixed2
    MatrixMadness:
      type: object
      properties:
        cube:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: object
                properties:
                  x:
                    type: integer
                  y:
                    type: integer
                  z:
                    type: integer
                  value:
                    type: number
                required:
                  - x
                  - y
                  - z
                  - value
        hyperCube:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: integer
        grid:
          type: array
          items:
            type: array
            items:
              type: object
              properties:
                cell:
                  type: object
                  properties:
                    row:
                      type: integer
                    col:
                      type: integer
                    data:
                      type: object
                      properties:
                        content:
                          type: string
                        metadata:
                          type: object
                          additionalProperties:
                            type: string
                      required:
                        - content
                        - metadata
                  required:
                    - row
                    - col
                    - data
              required:
                - cell
      required:
        - cube
        - hyperCube
        - grid
    OptionalMaze:
      type: object
      properties:
        required:
          type: string
        opt1:
          type: object
          properties:
            opt2:
              type: object
              properties:
                opt3:
                  type: object
                  properties:
                    opt4:
                      type: object
                      properties:
                        opt5:
                          type: object
                          properties:
                            deepValue:
                              type: string
        optArray:
          type: array
          items:
            type: object
            properties:
              optInner:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: integer
        optMap:
          type: object
          additionalProperties:
            type: object
            properties:
              optMapInner:
                type: object
                properties:
                  data:
                    type: string
      required:
        - required
    UltimateStressTest:
      type: object
      properties:
        chaos1:
          type: array
          items:
            type: array
            items:
              type: object
              additionalProperties:
                type: array
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      fieldA:
                        type: string
                      valueA:
                        type: integer
                      nested:
                        type: array
                        items:
                          type: object
                          properties:
                            fieldB:
                              type: number
                            flagB:
                              type: boolean
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  fieldC:
                                    type: string
                                    format: date-time
                                  listC:
                                    type: array
                                    items:
                                      type: string
                                  data:
                                    type: array
                                    items:
                                      type: array
                                      items:
                                        type: object
                                        additionalProperties:
                                          type: object
                                          properties:
                                            fieldA:
                                              type: string
                                            valueA:
                                              type: integer
                                            value:
                                              type: integer
                                          required:
                                            - fieldA
                                            - valueA
                                            - value
                                required:
                                  - fieldC
                                  - listC
                                  - data
                          required:
                            - fieldB
                            - flagB
                            - items
                    required:
                      - fieldA
                      - valueA
                      - nested
        chaos2:
          type: object
          properties:
            level1:
              type: object
              properties:
                fieldA:
                  type: string
                valueA:
                  type: integer
                level2:
                  type: object
                  properties:
                    fieldB:
                      type: number
                    flagB:
                      type: boolean
                    level3:
                      type: object
                      properties:
                        fieldC:
                          type: string
                          format: date-time
                        listC:
                          type: array
                          items:
                            type: string
                        level4:
                          type: object
                          properties:
                            final:
                              type: object
                              additionalProperties:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    fieldA:
                                      type: string
                                    valueA:
                                      type: integer
                                    fieldB:
                                      type: number
                                    flagB:
                                      type: boolean
                                    fieldC:
                                      type: string
                                      format: date-time
                                    listC:
                                      type: array
                                      items:
                                        type: string
                                    data:
                                      type: array
                                      items:
                                        type: array
                                        items:
                                          type: array
                                          items:
                                            type: string
                                  required:
                                    - fieldA
                                    - valueA
                                    - fieldB
                                    - flagB
                                    - fieldC
                                    - listC
                                    - data
                          required:
                            - final
                      required:
                        - fieldC
                        - listC
                  required:
                    - fieldB
                    - flagB
              required:
                - fieldA
                - valueA
        chaos3:
          type: array
          items:
            type: object
            additionalProperties:
              type: array
              items:
                type: object
                properties:
                  inner:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          value:
                            type: integer
                          nested:
                            type: array
                            items:
                              type: object
                              properties:
                                a:
                                  type: string
                                b:
                                  type: integer
                              required:
                                - a
                                - b
                        required:
                          - value
                          - nested
                required:
                  - inner
      required:
        - chaos3
  requestBodies:
    ExtremeServiceCollectionTestInput:
      description: Request body for ExtremeService/collectionTest procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/CollectionHell"
            required:
              - data
    ExtremeServiceDeepMetadataTestInput:
      description: Request body for ExtremeService/deepMetadataTest procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              root:
                $ref: "#/components/schemas/DeepMetadata"
              maxDepth:
                type: integer
            required:
              - root
    ExtremeServiceHandleMatricesInput:
      description: Request body for ExtremeService/handleMatrices procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              matrices:
                $ref: "#/components/schemas/MatrixMadness"
            required:
              - matrices
    ExtremeServiceInlineExtremeInput:
      description: Request body for ExtremeService/inlineExtreme procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              crazy:
                type: object
                properties:
                  fieldA:
                    type: string
                  valueA:
                    type: integer
                  level1:
                    type: object
                    properties:
                      fieldB:
                        type: number
                      flagB:
                        type: boolean
                      arrays:
                        type: array
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              fieldC:
                                type: string
                                format: date-time
                              listC:
                                type: array
                                items:
                                  type: string
                              data:
                                type: array
                                items:
                                  type: object
                                  additionalProperties:
                                    type: object
                                    properties:
                                      nested:
                                        type: array
                                        items:
                                          type: array
                                          items:
                                            type: object
                                            properties:
                                              deep:
                                                type: array
                                                items:
                                                  type: array
                                                  items:
                                                    type: array
                                                    items:
                                                      type: integer
                                            required:
                                              - deep
                                    required:
                                      - nested
                            required:
                              - fieldC
                              - listC
                              - data
                    required:
                      - fieldB
                      - flagB
                      - arrays
                required:
                  - fieldA
                  - valueA
                  - level1
            required:
              - crazy
    ExtremeServiceOptionalLabyrinthInput:
      description: Request body for ExtremeService/optionalLabyrinth procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              maze:
                $ref: "#/components/schemas/OptionalMaze"
            required:
              - maze
    ExtremeServiceProcessDeepInput:
      description: Request body for ExtremeService/processDeep procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/DeepNesting"
            required:
              - data
    ExtremeServiceQueryMapsInput:
      description: Request body for ExtremeService/queryMaps procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              query:
                $ref: "#/components/schemas/MapCeption"
            required:
              - query
    ExtremeServiceStressTestInput:
      description: Request body for ExtremeService/stressTest procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              stress:
                $ref: "#/components/schemas/UltimateStressTest"
            required:
              - stress
  responses:
    ExtremeServiceCollectionTestOutput:
      description: Response for ExtremeService/collectionTest procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  processed:
                    $ref: "#/components/schemas/CollectionHell"
                required:
                  - processed
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    ExtremeServiceDeepMetadataTestOutput:
      description: Response for ExtremeService/deepMetadataTest procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  processed:
                    $ref: "#/components/schemas/DeepMetadata"
                  depth:
                    type: integer
                required:
                  - processed
                  - depth
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    ExtremeServiceHandleMatricesOutput:
      description: Response for ExtremeService/handleMatrices procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/MatrixMadness"
                required:
                  - result
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    ExtremeServiceInlineExtremeOutput:
      description: Response for ExtremeService/inlineExtreme procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      status:
                        type: boolean
                      data:
                        type: object
                        properties:
                          fieldA:
                            type: string
                          valueA:
                            type: integer
                          fieldB:
                            type: number
                          flagB:
                            type: boolean
                          fieldC:
                            type: string
                            format: date-time
                          listC:
                            type: array
                            items:
                              type: string
                          processed:
                            type: object
                            additionalProperties:
                              type: array
                              items:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    value:
                                      type: string
                                    meta:
                                      type: object
                                      properties:
                                        tags:
                                          type: array
                                          items:
                                            type: array
                                            items:
                                              type: string
                                      required:
                                        - tags
                                  required:
                                    - value
                                    - meta
                        required:
                          - fieldA
                          - valueA
                          - fieldB
                          - flagB
                          - fieldC
                          - listC
                          - processed
                    required:
                      - status
                required:
                  - result
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    ExtremeServiceOptionalLabyrinthOutput:
      description: Response for ExtremeService/optionalLabyrinth procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  solved:
                    $ref: "#/components/schemas/OptionalMaze"
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    ExtremeServiceProcessDeepOutput:
      description: Response for ExtremeService/processDeep procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  processed:
                    $ref: "#/components/schemas/DeepNesting"
                required:
                  - processed
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    ExtremeServiceQueryMapsOutput:
      description: Response for ExtremeService/queryMaps procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  results:
                    $ref: "#/components/schemas/MapCeption"
                required:
                  - results
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    ExtremeServiceStressTestOutput:
      description: Response for ExtremeService/stressTest procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/UltimateStressTest"
                  status:
                    type: string
                required:
                  - result
                  - status
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
