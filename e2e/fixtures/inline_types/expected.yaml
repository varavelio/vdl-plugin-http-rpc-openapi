openapi: 3.0.0
info:
  title: Inline Types API
  version: 1.0.0
security:
  - Auth: []
paths: {}
components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Authorization
      description: Enter the API key value.
  schemas:
    ComplexInlineTypes:
      type: object
      properties:
        files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
            required:
              - path
              - content
        meta:
          type: object
          additionalProperties:
            type: object
            properties:
              createdAt:
                type: string
              author:
                type: string
            required:
              - createdAt
              - author
        groupedFiles:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                size:
                  type: integer
              required:
                - name
                - size
        configs:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
              properties:
                key:
                  type: string
                value:
                  type: string
              required:
                - key
                - value
        grid:
          type: array
          items:
            type: array
            items:
              type: object
              properties:
                x:
                  type: integer
                y:
                  type: integer
              required:
                - x
                - y
        simple:
          type: object
          properties:
            name:
              type: string
            enabled:
              type: boolean
          required:
            - name
            - enabled
        deepNest:
          type: object
          properties:
            level1:
              type: string
            child:
              type: object
              properties:
                level2:
                  type: integer
                grandChild:
                  type: object
                  properties:
                    level3:
                      type: boolean
                    greatGrandChild:
                      type: object
                      properties:
                        level4:
                          type: number
                        data:
                          type: string
                      required:
                        - level4
                        - data
                  required:
                    - level3
                    - greatGrandChild
              required:
                - level2
                - grandChild
          required:
            - level1
            - child
      required:
        - files
        - meta
        - groupedFiles
        - configs
        - grid
        - simple
        - deepNest
