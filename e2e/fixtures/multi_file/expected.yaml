openapi: 3.0.0
info:
  title: Multi-File API
  version: 1.0.0
security:
  - AuthToken: []
tags:
  - name: UserServiceProcedures
    description: Procedures for UserService
paths:
  /userService/getUser:
    post:
      tags:
        - UserServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/UserServiceGetUserInput"
      responses:
        "200":
          $ref: "#/components/responses/UserServiceGetUserOutput"
  /userService/listUsers:
    post:
      tags:
        - UserServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/UserServiceListUsersInput"
      responses:
        "200":
          $ref: "#/components/responses/UserServiceListUsersOutput"
components:
  securitySchemes:
    AuthToken:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Enter the full value for the Authorization header. The specific format
        (Bearer, Basic, API Key, etc.) is determined by the server's
        implementation.


        ---

        **Examples:**

        - **Bearer Token:** `Bearer eyJhbGciOiJIUzI1Ni...` (a JWT token)

        - **Basic Auth:** `Basic dXNlcm5hbWU6cGFzc3dvcmQ=` (a base64 encoding of
        `username:password`)

        - **API Key:** `sk_live_123abc456def` (a raw token)
  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
      required:
        - page
        - limit
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          $ref: "#/components/schemas/Status"
      required:
        - id
        - name
        - email
        - status
      description: User type documentation loaded from external file.
    Status:
      type: string
      enum:
        - Active
        - Inactive
  requestBodies:
    UserServiceGetUserInput:
      description: Request body for UserService/getUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
            required:
              - id
    UserServiceListUsersInput:
      description: Request body for UserService/listUsers procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              page:
                type: integer
              limit:
                type: integer
            required:
              - page
              - limit
  responses:
    UserServiceGetUserOutput:
      description: Response for UserService/getUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                required:
                  - user
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    UserServiceListUsersOutput:
      description: Response for UserService/listUsers procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  total:
                    type: integer
                required:
                  - users
                  - total
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
