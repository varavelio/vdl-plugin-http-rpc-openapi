openapi: 3.0.0
info:
  title: Multi-RPC API
  version: 1.0.0
security:
  - Auth: []
tags:
  - name: OrderServiceProcedures
    description: Order management service.
  - name: ProductServiceProcedures
    description: Product catalog service.
  - name: UserServiceProcedures
    description: User management service.
paths:
  /orderService/createOrder:
    post:
      operationId: orderServiceCreateOrder
      tags:
        - OrderServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/OrderServiceCreateOrderInput"
      responses:
        "200":
          $ref: "#/components/responses/OrderServiceCreateOrderOutput"
  /orderService/getOrdersByUser:
    post:
      operationId: orderServiceGetOrdersByUser
      tags:
        - OrderServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/OrderServiceGetOrdersByUserInput"
      responses:
        "200":
          $ref: "#/components/responses/OrderServiceGetOrdersByUserOutput"
  /productService/getProduct:
    post:
      operationId: productServiceGetProduct
      tags:
        - ProductServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ProductServiceGetProductInput"
      responses:
        "200":
          $ref: "#/components/responses/ProductServiceGetProductOutput"
  /productService/searchProducts:
    post:
      operationId: productServiceSearchProducts
      tags:
        - ProductServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ProductServiceSearchProductsInput"
      responses:
        "200":
          $ref: "#/components/responses/ProductServiceSearchProductsOutput"
  /userService/getUser:
    post:
      operationId: userServiceGetUser
      tags:
        - UserServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/UserServiceGetUserInput"
      responses:
        "200":
          $ref: "#/components/responses/UserServiceGetUserOutput"
  /userService/listUsers:
    post:
      operationId: userServiceListUsers
      tags:
        - UserServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/UserServiceListUsersInput"
      responses:
        "200":
          $ref: "#/components/responses/UserServiceListUsersOutput"
components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Authorization
      description: "Enter the API key value. Sent as `Authorization: {apiKey}` header."
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        productIds:
          type: array
          items:
            type: string
        total:
          type: number
      required:
        - id
        - userId
        - productIds
        - total
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
      required:
        - id
        - name
        - price
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
  requestBodies:
    OrderServiceCreateOrderInput:
      description: Request body for OrderService/createOrder procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              userId:
                type: string
              productIds:
                type: array
                items:
                  type: string
            required:
              - userId
              - productIds
    OrderServiceGetOrdersByUserInput:
      description: Request body for OrderService/getOrdersByUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              userId:
                type: string
            required:
              - userId
    ProductServiceGetProductInput:
      description: Request body for ProductService/getProduct procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
            required:
              - id
    ProductServiceSearchProductsInput:
      description: Request body for ProductService/searchProducts procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              query:
                type: string
              maxPrice:
                type: number
            required:
              - query
    UserServiceGetUserInput:
      description: Request body for UserService/getUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
            required:
              - id
    UserServiceListUsersInput:
      description: Request body for UserService/listUsers procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              limit:
                type: integer
              offset:
                type: integer
            required:
              - limit
              - offset
  responses:
    OrderServiceCreateOrderOutput:
      description: Response for OrderService/createOrder procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
                required:
                  - order
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    OrderServiceGetOrdersByUserOutput:
      description: Response for OrderService/getOrdersByUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                required:
                  - orders
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    ProductServiceGetProductOutput:
      description: Response for ProductService/getProduct procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  product:
                    $ref: "#/components/schemas/Product"
                required:
                  - product
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    ProductServiceSearchProductsOutput:
      description: Response for ProductService/searchProducts procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                required:
                  - products
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    UserServiceGetUserOutput:
      description: Response for UserService/getUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                required:
                  - user
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    UserServiceListUsersOutput:
      description: Response for UserService/listUsers procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  total:
                    type: integer
                required:
                  - users
                  - total
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
