openapi: 3.0.0
info:
  title: Optional Fields API
  version: 1.0.0
security:
  - AuthToken: []
tags:
  - name: ProfileServiceProcedures
    description: Procedures for ProfileService
paths:
  /profileService/getProfile:
    post:
      tags:
        - ProfileServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ProfileServiceGetProfileInput"
      responses:
        "200":
          $ref: "#/components/responses/ProfileServiceGetProfileOutput"
  /profileService/updateProfile:
    post:
      tags:
        - ProfileServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ProfileServiceUpdateProfileInput"
      responses:
        "200":
          $ref: "#/components/responses/ProfileServiceUpdateProfileOutput"
components:
  securitySchemes:
    AuthToken:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Enter the full value for the Authorization header. The specific format
        (Bearer, Basic, API Key, etc.) is determined by the server's
        implementation.


        ---

        **Examples:**

        - **Bearer Token:** `Bearer eyJhbGciOiJIUzI1Ni...` (a JWT token)

        - **Basic Auth:** `Basic dXNlcm5hbWU6cGFzc3dvcmQ=` (a base64 encoding of
        `username:password`)

        - **API Key:** `sk_live_123abc456def` (a raw token)
  schemas:
    Profile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        bio:
          type: string
        age:
          type: integer
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - id
        - name
  requestBodies:
    ProfileServiceGetProfileInput:
      description: Request body for ProfileService/getProfile procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
              includeDetails:
                type: boolean
            required:
              - id
    ProfileServiceUpdateProfileInput:
      description: Request body for ProfileService/updateProfile procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              bio:
                type: string
              age:
                type: integer
              tags:
                type: array
                items:
                  type: string
            required:
              - id
  responses:
    ProfileServiceGetProfileOutput:
      description: Response for ProfileService/getProfile procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
                  cached:
                    type: boolean
                required:
                  - profile
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    ProfileServiceUpdateProfileOutput:
      description: Response for ProfileService/updateProfile procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  updated:
                    type: boolean
                  profile:
                    $ref: "#/components/schemas/Profile"
                required:
                  - updated
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
