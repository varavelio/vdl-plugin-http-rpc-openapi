openapi: 3.0.0
info:
  title: Override Test
  version: 1.0.0
security:
  - Auth: []
tags:
  - name: ServiceProcedures
    description: Procedures for Service
paths:
  /service/ping:
    post:
      operationId: servicePing
      tags:
        - ServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ServicePingInput"
      responses:
        "200":
          $ref: "#/components/responses/ServicePingOutput"
        "404":
          $ref: "#/components/responses/RouteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/TransportFailure"
components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Authorization
      description: "Enter the API key value. Sent as `Authorization: {apiKey}` header."
  requestBodies:
    ServicePingInput:
      description: Request body for Service/ping procedure
      content:
        application/json:
          schema:
            type: object
            properties: {}
  responses:
    InternalError:
      description: Unhandled server failure. Transport failure, never an application
        error envelope.
    RouteNotFound:
      description: Unknown route. The procedure path does not exist. Transport
        failure, never an application error envelope.
    ServicePingOutput:
      description: Response for Service/ping procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties: {}
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    TransportFailure:
      description: Transport or infrastructure failure. Transport failure, never an
        application error envelope.
