openapi: 3.0.0
info:
  title: Override Test
  version: 1.0.0
security:
  - AuthToken: []
tags:
  - name: ServiceProcedures
    description: Procedures for Service
paths:
  /service/ping:
    post:
      tags:
        - ServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ServicePingInput"
      responses:
        "200":
          $ref: "#/components/responses/ServicePingOutput"
components:
  securitySchemes:
    AuthToken:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Enter the full value for the Authorization header. The specific format
        (Bearer, Basic, API Key, etc.) is determined by the server's
        implementation.


        ---

        **Examples:**

        - **Bearer Token:** `Bearer eyJhbGciOiJIUzI1Ni...` (a JWT token)

        - **Basic Auth:** `Basic dXNlcm5hbWU6cGFzc3dvcmQ=` (a base64 encoding of
        `username:password`)

        - **API Key:** `sk_live_123abc456def` (a raw token)
  requestBodies:
    ServicePingInput:
      description: Request body for Service/ping procedure
      content:
        application/json:
          schema:
            type: object
            properties: {}
  responses:
    ServicePingOutput:
      description: Response for Service/ping procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties: {}
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
