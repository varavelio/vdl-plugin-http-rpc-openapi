openapi: 3.0.0
info:
  title: Override Test
  version: 1.0.0
security:
  - Auth: []
tags:
  - name: ServiceProcedures
    description: Procedures for Service
paths:
  /service/ping:
    post:
      operationId: servicePing
      tags:
        - ServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/ServicePingInput"
      responses:
        "200":
          $ref: "#/components/responses/ServicePingOutput"
components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Authorization
      description: "Enter the API key value. Sent as `Authorization: {apiKey}` header."
  requestBodies:
    ServicePingInput:
      description: Request body for Service/ping procedure
      content:
        application/json:
          schema:
            type: object
            properties: {}
  responses:
    ServicePingOutput:
      description: Response for Service/ping procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties: {}
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
