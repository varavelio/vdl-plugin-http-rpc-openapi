openapi: 3.0.0
info:
  title: Spreads API
  version: 1.0.0
security:
  - Auth: []
tags:
  - name: SpreadServiceProcedures
    description: Procedures for SpreadService
paths:
  /spreadService/complexSpread:
    post:
      operationId: spreadServiceComplexSpread
      tags:
        - SpreadServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/SpreadServiceComplexSpreadInput"
      responses:
        "200":
          $ref: "#/components/responses/SpreadServiceComplexSpreadOutput"
        "404":
          $ref: "#/components/responses/RouteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/TransportFailure"
  /spreadService/createUser:
    post:
      operationId: spreadServiceCreateUser
      tags:
        - SpreadServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/SpreadServiceCreateUserInput"
      responses:
        "200":
          $ref: "#/components/responses/SpreadServiceCreateUserOutput"
        "404":
          $ref: "#/components/responses/RouteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/TransportFailure"
  /spreadService/listItems:
    post:
      operationId: spreadServiceListItems
      tags:
        - SpreadServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/SpreadServiceListItemsInput"
      responses:
        "200":
          $ref: "#/components/responses/SpreadServiceListItemsOutput"
        "404":
          $ref: "#/components/responses/RouteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/TransportFailure"
  /spreadService/searchWithMetadata:
    post:
      operationId: spreadServiceSearchWithMetadata
      tags:
        - SpreadServiceProcedures
      requestBody:
        $ref: "#/components/requestBodies/SpreadServiceSearchWithMetadataInput"
      responses:
        "200":
          $ref: "#/components/responses/SpreadServiceSearchWithMetadataOutput"
        "404":
          $ref: "#/components/responses/RouteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/TransportFailure"
components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Authorization
      description: "Enter the API key value. Sent as `Authorization: {apiKey}` header."
  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        title:
          type: string
        body:
          type: string
        authorId:
          type: string
      required:
        - id
        - createdAt
        - updatedAt
        - version
        - tags
        - metadata
        - title
        - body
        - authorId
    Collection:
      type: object
      properties:
        version:
          type: integer
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              value:
                type: string
            required:
              - id
              - value
      required:
        - version
        - tags
        - metadata
        - items
    Comment:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        text:
          type: string
        author:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            avatar:
              type: string
          required:
            - id
            - name
      required:
        - id
        - createdAt
        - updatedAt
        - text
        - author
    DeepSpread:
      type: object
      properties:
        level1:
          type: object
          properties:
            id:
              type: string
            level2:
              type: object
              properties:
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
                level3:
                  type: object
                  properties:
                    version:
                      type: integer
                    tags:
                      type: array
                      items:
                        type: string
                    metadata:
                      type: object
                      additionalProperties:
                        type: string
                    value:
                      type: string
                  required:
                    - version
                    - tags
                    - metadata
                    - value
              required:
                - createdAt
                - updatedAt
                - level3
          required:
            - id
            - level2
      required:
        - level1
    Identifiable:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    Metadata:
      type: object
      properties:
        version:
          type: integer
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - version
        - tags
        - metadata
    OptionalSpread:
      type: object
      properties:
        id:
          type: string
        requiredField:
          type: string
        optionalField:
          type: integer
        optionalObject:
          type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            data:
              type: string
          required:
            - createdAt
            - updatedAt
            - data
      required:
        - id
        - requiredField
    PaginatedResult:
      type: object
      properties:
        total:
          type: integer
        hasMore:
          type: boolean
      required:
        - total
        - hasMore
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - page
        - limit
    Registry:
      type: object
      properties:
        version:
          type: integer
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        entries:
          type: object
          additionalProperties:
            type: object
            properties:
              id:
                type: string
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              data:
                type: string
            required:
              - id
              - createdAt
              - updatedAt
              - data
      required:
        - version
        - tags
        - metadata
        - entries
    SpreadInArrays:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              data:
                type: string
            required:
              - id
              - createdAt
              - updatedAt
              - data
        matrix:
          type: array
          items:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                x:
                  type: integer
                y:
                  type: integer
              required:
                - id
                - x
                - y
      required:
        - items
        - matrix
    SpreadInMaps:
      type: object
      properties:
        lookup:
          type: object
          additionalProperties:
            type: object
            properties:
              id:
                type: string
              value:
                type: integer
            required:
              - id
              - value
        nested:
          type: object
          additionalProperties:
            type: object
            properties:
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              entries:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    data:
                      type: string
                  required:
                    - id
                    - data
            required:
              - createdAt
              - updatedAt
              - entries
      required:
        - lookup
        - nested
    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - createdAt
        - updatedAt
    User:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
        email:
          type: string
      required:
        - id
        - createdAt
        - updatedAt
        - name
        - email
  requestBodies:
    SpreadServiceComplexSpreadInput:
      description: Request body for SpreadService/complexSpread procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              request:
                type: object
                properties:
                  id:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  payload:
                    type: object
                    properties:
                      version:
                        type: integer
                      tags:
                        type: array
                        items:
                          type: string
                      metadata:
                        type: object
                        additionalProperties:
                          type: string
                      data:
                        type: string
                    required:
                      - version
                      - tags
                      - metadata
                      - data
                required:
                  - id
                  - createdAt
                  - updatedAt
                  - payload
            required:
              - request
    SpreadServiceCreateUserInput:
      description: Request body for SpreadService/createUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              name:
                type: string
              email:
                type: string
            required:
              - createdAt
              - updatedAt
              - name
              - email
    SpreadServiceListItemsInput:
      description: Request body for SpreadService/listItems procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              page:
                type: integer
              limit:
                type: integer
              offset:
                type: integer
              filter:
                type: string
              sortBy:
                type: string
            required:
              - page
              - limit
    SpreadServiceSearchWithMetadataInput:
      description: Request body for SpreadService/searchWithMetadata procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              page:
                type: integer
              limit:
                type: integer
              offset:
                type: integer
              version:
                type: integer
              tags:
                type: array
                items:
                  type: string
              metadata:
                type: object
                additionalProperties:
                  type: string
              query:
                type: string
            required:
              - page
              - limit
              - version
              - tags
              - metadata
              - query
  responses:
    InternalError:
      description: Unhandled server failure. Transport failure, never an application
        error envelope.
    RouteNotFound:
      description: Unknown route. The procedure path does not exist. Transport
        failure, never an application error envelope.
    SpreadServiceComplexSpreadOutput:
      description: Response for SpreadService/complexSpread procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  response:
                    type: object
                    properties:
                      id:
                        type: string
                      result:
                        type: object
                        properties:
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                          success:
                            type: boolean
                        required:
                          - createdAt
                          - updatedAt
                          - success
                    required:
                      - id
                      - result
                required:
                  - response
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    SpreadServiceCreateUserOutput:
      description: Response for SpreadService/createUser procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  id:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  name:
                    type: string
                  email:
                    type: string
                required:
                  - id
                  - createdAt
                  - updatedAt
                  - name
                  - email
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    SpreadServiceListItemsOutput:
      description: Response for SpreadService/listItems procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  total:
                    type: integer
                  hasMore:
                    type: boolean
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Article"
                required:
                  - total
                  - hasMore
                  - items
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    SpreadServiceSearchWithMetadataOutput:
      description: Response for SpreadService/searchWithMetadata procedure
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              output:
                type: object
                properties:
                  total:
                    type: integer
                  hasMore:
                    type: boolean
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        score:
                          type: number
                        data:
                          type: string
                      required:
                        - id
                        - score
                        - data
                required:
                  - total
                  - hasMore
                  - results
              error:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    type: string
                  code:
                    type: string
                  details:
                    type: object
                    properties: {}
                    additionalProperties: true
                required:
                  - message
            required:
              - ok
    TransportFailure:
      description: Transport or infrastructure failure. Transport failure, never an
        application error envelope.
