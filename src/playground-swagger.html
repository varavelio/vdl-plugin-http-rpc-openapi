<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>%TITLE%</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.3/swagger-ui.css"
      crossorigin
    />
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.3/swagger-ui-bundle.js"
      crossorigin
    ></script>
    <script>
      const OPENAPI_SPEC = %OPENAPI_SPEC%;
      window.ui = SwaggerUIBundle({
        spec: OPENAPI_SPEC,
        dom_id: "#swagger-ui",
        deepLinking: true,
        tryItOutEnabled: true,
        displayRequestDuration: true,
        filter: true,
        persistAuthorization: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
      });
    </script>
  </body>
</html>
